name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A build check only. The site itself is served by GitHub Pages from main's /docs folder (legacy
# branch deployment), so this workflow does not deploy.
permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends doxygen graphviz

    - name: Generate documentation
      run: |
        make docs-clean
        make docs

    - name: Verify documentation
      run: |
        if [ ! -f "docs/html/index.html" ]; then
          echo "Documentation generation failed - index.html not found"
          exit 1
        fi
        echo "Documentation generated successfully" 
name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A build check only. The site itself is served by GitHub Pages from main's /docs folder (legacy
# branch deployment), so this workflow does not deploy.
permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          doxygen \
          graphviz \
          cmake \
          build-essential \
          nvidia-cuda-dev \
          nvidia-cuda-toolkit \
          ninja-build \
          nlohmann-json3-dev \
          libomp-dev \
          libopenblas-dev \
          liblapack-dev \
          pkg-config \
          g++ \
          gcc

    - name: Configure CMake
      run: |
        mkdir -p build
        cmake -B build \
          -DCMAKE_CXX_COMPILER=$(which g++) \
          -DCMAKE_C_COMPILER=$(which gcc) \
          -DUSE_CUDA=OFF

    - name: Generate documentation
      run: |
        make docs-clean
        make docs

    - name: Verify documentation
      run: |
        if [ ! -f "docs/html/index.html" ]; then
          echo "Documentation generation failed - index.html not found"
          exit 1
        fi
        echo "Documentation generated successfully" 